name: portfolio

# Запуск: docker compose up -d
# Сайт: http://localhost:3000
# MySQL с хоста (DBeaver): localhost:3011, база portfolio, пользователь root / rootpassword
#
# Файлы проекта (index.html, styles.css, *.js) монтируются в контейнер —
# после правок достаточно обновить страницу (Ctrl+F5).
# Пересборка (docker compose up --build) нужна только при изменении package.json или Dockerfile.

networks:
  portfolio_internal:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: unless-stopped
    networks:
      - portfolio_internal
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio}
      MYSQL_USER: ${MYSQL_USER:-portfolio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portfoliopass}
    ports:
      - "${MYSQL_PORT:-3011}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build: .
    container_name: portfolio-app
    restart: unless-stopped
    networks:
      - portfolio_internal
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-portfolio}
      DB_USER: ${MYSQL_USER:-portfolio}
      DB_PASSWORD: ${MYSQL_PASSWORD:-portfoliopass}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: